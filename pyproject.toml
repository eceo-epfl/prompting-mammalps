[project]
name = "prompting-mammalps"
version = "0.1.0"
description = "Text-to-video retrieval benchmark on MammAlps-S2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=3.0.1",
    "tqdm>=4.67.1",
    "huggingface-hub>=0.30",
    "opencv-python>=4.13.0.92",
    "ffmpeg-python>=0.2.0",
    "supervision>=0.24",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
# LLM-based parsing agent (models/llm)
smolagents = [
    "smolagents>=1.0",
    "transformers>=4.36.0",
    "torch>=2.10.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
